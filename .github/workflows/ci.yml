name: CI

on:
  push:
    branches:
      - feature/develop
      - master
      - main
  pull_request:
    branches:
      - feature/develop
      - master
      - main

jobs:
  cross_build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Run CI script
        shell: bash
        run: |
          bash ./ci.sh

      - name: Build project
        shell: bash
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Deploy
        shell: bash
        run: |
          echo "Deploying C++ project on ${{ matrix.os }}"
          echo "Build completed successfully"
